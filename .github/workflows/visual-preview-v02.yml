name: Lazy Player v0.2 visual smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-preview-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug
      - name: Capture real rendered Compose screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.lazy.player.next/com.lazy.player.MainActivity
            sleep 9
            adb shell pidof com.lazy.player.next
            adb exec-out screencap -p > screenshots/first-launch.png
            adb shell uiautomator dump /data/local/tmp/window.xml
            adb pull /data/local/tmp/window.xml screenshots/first-launch.xml
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            root=ET.parse("screenshots/first-launch.xml").getroot()
            nodes=[n for n in root.iter() if "Choose my FLAC folder" in n.attrib.get("text","")]
            if not nodes:
                raise RuntimeError("Select folder button missing from first-launch screen")
            n=nodes[0]; b=list(map(int,re.findall(r'\d+',n.attrib["bounds"])))
            import subprocess
            subprocess.check_call(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)])
            PY
            sleep 5
            adb exec-out screencap -p > screenshots/folder-picker.png
            adb shell uiautomator dump /data/local/tmp/picker.xml
            adb pull /data/local/tmp/picker.xml screenshots/folder-picker.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazy-player-0-2-rendered-screens
          path: screenshots/
          if-no-files-found: warn
