name: Lazy Player v0.5 Review Build
on:
  push:
    branches: ['redesign/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify preview identity and APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging
          grep -F "package: name='com.lazy.player.preview'" /tmp/badging
          grep -F "versionName='0.5.2-preview'" /tmp/badging
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-sha256
      - name: Stage Android SDK signing tool for private final signing
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-sdk-tool
          path: signing-tool/apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-player-0.5.2-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
