name: Lazy Player UI Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-audit.yml'
      - 'tools/ui_smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile Android APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug
      - name: Generate synthetic music fixture
        run: |
          python3 - <<'PY'
          import array, math, wave, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "Stage_Light.wav")
          samples = array.array("h", (int(7200 * math.sin(2 * math.pi * 440 * i / 11025)) for i in range(35 * 11025)))
          with wave.open(path, "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(11025)
              audio.writeframes(samples.tobytes())
          print(path)
          PY
      - name: Android emulator screenshots and smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          sdcard-path-or-size: 512M
          ram-size: 2048M
          disable-animations: true
          script: bash tools/ui_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazy-player-ui-audit-screenshots
          path: screenshots/
          if-no-files-found: warn
