name: Publish Lazy Player Refined v0.3 preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-refined.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Android build and verify identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 40465346100 -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = "success"
          mkdir -p dist
          gh run download 40465346100 -R "$GITHUB_REPOSITORY" -n lazy-player-debug-apk -D dist
          test -s dist/app-debug.apk
          echo "328d831e34e257d8b883fd1ccbf643ee94bce94747609649de781301ee839ceb  dist/app-debug.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/app-debug.apk | tee /tmp/badging.txt
          grep -F "package: name='com.lazy.player.refined'" /tmp/badging.txt
          grep -F "versionName='0.3.0-preview'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/app-debug.apk
          mv dist/app-debug.apk dist/LazyPlayer-Refined-v0.3.0-preview.apk
          (cd dist && sha256sum LazyPlayer-Refined-v0.3.0-preview.apk > SHA256SUMS.txt)
      - name: Publish test preview, do not overwrite other versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.0-refined-preview.1"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published; refusing to overwrite it"
            exit 0
          fi
          cat > /tmp/notes.md <<'NOTES'
          ## Lazy Player Refined 0.3.0 — music-first UI preview

          **Separate Android package**: `com.lazy.player.refined`. Installs alongside Lazy Player `com.lazy.player` and Lazy Player Next `com.lazy.player.next`.

          Redesigned library:
          - Compact header with no duplicate headline/tagline.
          - Single folder picker row, with saved scoped folder access and recursive FLAC scans.
          - Clean Songs, Albums and Artists tabs, shorter track rows and more visible music.
          - Slim navigation plus artwork-frosted mini-player, with clearance above controls.
          
          Now Playing:
          - Responsive album-art proportions, grouped metadata and optional USB DAC detection.
          - A single queue button and a 3dp seek rail with a small thumb.
          - Glass reduced to purposeful surfaces; no claim of real dynamic backdrop refraction.
          
          Audio remains Android Media3. **USB DAC detection is not a bit-perfect playback guarantee.**
          This is a **debug preview**: Android cloud compilation and JVM unit tests passed, but visual screenshot QA and physical-device FLAC playback are not yet certified.
          Future test APKs may use different debug signing keys and require uninstalling this preview before replacement.
          
          Build: [GitHub Actions 40465346100](https://github.com/Kotaru27/Lazy-player/actions/runs/40465346100) at commit `d668d79fd277d0ecde3c975e986be7a49ccfb071`.
          APK SHA-256: `328d831e34e257d8b883fd1ccbf643ee94bce94747609649de781301ee839ceb`.
          NOTES
          gh release create "$tag" dist/LazyPlayer-Refined-v0.3.0-preview.apk dist/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target d668d79fd277d0ecde3c975e986be7a49ccfb071 \
            --title "Lazy Player Refined v0.3 — Music-first Glass Preview" \
            --notes-file /tmp/notes.md --prerelease --latest=false
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url,tagName,assets,isDraft,isPrerelease
