name: Publish signed Lazy Player v0.5.5 Artwork Fluidity
on:
  push:
    branches: ['redesign/v055-artwork-fluidity']
    paths:
      - '.github/workflows/publish-v055.yml'
      - 'tools/reconstruct_signed_v055.py'
      - 'release/v055_signed_delta.b64'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  signed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Android signing inspection tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Require passed unit build and emulator UI audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 40498773520 -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
          test "$(gh run view 40498767419 -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
          echo 'The UI test SHA predates only a workflow YAML edit; app+Gradle sources are identical.'
      - name: Fetch exact tested Android v0.5.5 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 40498773520 -R "$GITHUB_REPOSITORY" -n lazy-player-0.5.5-preview-apk -D dist
          echo '6d7724343009817cb52651280c946d9696c6148471274f9419513b53f899d5b0  dist/app-debug.apk' | sha256sum --check
      - name: Recover owner-signed update from verified public APK patch
        run: |
          set -euo pipefail
          python3 tools/reconstruct_signed_v055.py \
            dist/app-debug.apk release/v055_signed_delta.b64 dist/LazyPlayer-v0.5.5-Preview.apk
          echo 'd51e4be82db08a7df3e7e32ecb61ae1af10f2898f2064ce3bf0a5d5e5a5a85b0  dist/LazyPlayer-v0.5.5-Preview.apk' | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/LazyPlayer-v0.5.5-Preview.apk | tee /tmp/v055_badging
          grep -F "package: name='com.lazy.player.preview'" /tmp/v055_badging
          grep -F "versionCode='6'" /tmp/v055_badging
          grep -F "versionName='0.5.5-preview'" /tmp/v055_badging
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/LazyPlayer-v0.5.5-Preview.apk | tee /tmp/v055_certs
          grep -F '8b329cb559e2ff4e39d3106cd8993af0463ceef7da8adf6fbaece6b4da0f58c4' /tmp/v055_certs
          (cd dist && sha256sum LazyPlayer-v0.5.5-Preview.apk > SHA256SUMS.txt)
      - name: Publish only once to immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.5.5-preview'
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists: refusing to replace APK'
            exit 1
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Lazy Player v0.5.5 — Artwork Fluidity Preview

          Install `LazyPlayer-v0.5.5-Preview.apk` from Assets. This is a signed Android application update, not a mockup.

          - Prevent repeated concurrent decoding of an identical album cover across the dock and full player.
          - Preload neighboring album covers in the background while Now Playing is open, when shuffle is off and neighbors exist.
          - Retain cover crossfades, stable playback queue, miniature player swipe gestures, folder access, FLAC/Media3 playback, favorites, and USB DAC detection.
          - Same package ID `com.lazy.player.preview` and the same SHA-256 signing-certificate fingerprint as v0.5.1–v0.5.4, with increased versionCode `6`. Intended as an in-place upgrade from an already signed preview, not the very old debug-signed v0.5.0.

          **Build proof:** [Android JVM tests/build](https://github.com/Kotaru27/Lazy-player/actions/runs/40498773520). **UI proof:** [Android emulator instrumentation](https://github.com/Kotaru27/Lazy-player/actions/runs/40498767419) (6 tests normal, 6 at 135% text, 1 at 200%). UI tested identical app/Gradle sources; the last intervening commit only changes the GitHub workflow file.

          **Not yet proved:** smooth 90/100/120 Hz frame times on a physical phone, hardware DAC + FLAC playback, exact shared-element artwork transitions or true optical refraction. This is a focused artwork-latency improvement, not a complete native glass rewrite.

          Source commit used for compiled APK: `740d9f57319b8ea2ceb44260d0c4752dbca5e83a`.
          Final APK SHA-256: `d51e4be82db08a7df3e7e32ecb61ae1af10f2898f2064ce3bf0a5d5e5a5a85b0`.
          Signing certificate SHA-256: `8b329cb559e2ff4e39d3106cd8993af0463ceef7da8adf6fbaece6b4da0f58c4`.

          Changes remain on review branch `redesign/v055-artwork-fluidity`; `main` is untouched.
          NOTES
          gh release create "$tag" \
            dist/LazyPlayer-v0.5.5-Preview.apk dist/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" \
            --target 740d9f57319b8ea2ceb44260d0c4752dbca5e83a \
            --title 'Lazy Player v0.5.5 — Artwork Fluidity' \
            --notes-file /tmp/notes.md --latest
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url,tagName,assets,isDraft
